                [-10, 35], [0, 42], [10, 44], [25, 35], [35, 30], [45, 12], [51, 28], [70, 20], [80, 8], [90, 22], [105, 10], [120, 23], [140, 35], [140, 55], [170, 65], [180, 70],
                [180, 75], [60, 75], [30, 70], [10, 60], [-10, 60], [-10, 35]
            ],
            // アフリカ大陸
            [
                [-15, 30], [35, 30], [43, 11], [50, 10], [40, -10], [33, -27], [20, -35], [12, -34], [10, -5], [0, 5], [-15, 12], [-15, 30]
            ],
            // 北アメリカ大陸
            [
                [-168, 65], [-140, 60], [-125, 50], [-120, 35], [-105, 20], [-90, 16], [-80, 8], [-75, 20], [-80, 25], [-75, 35], [-60, 46], [-64, 50], [-80, 60], [-120, 70], [-168, 65]
            ],
            // 南アメリカ大陸
            [
                [-80, 8], [-60, 10], [-35, -5], [-38, -18], [-55, -34], [-68, -55], [-75, -45], [-72, -18], [-80, 8]
            ],
            // オーストラリア大陸
            [
                [114, -22], [130, -12], [142, -10], [153, -28], [148, -38], [138, -35], [115, -35], [114, -22]
            ],
            // 日本列島 (強調)
            [
                [130, 31], [132, 33], [136, 35], [140, 36], [141, 41], [145, 44], [140, 45], [138, 40], [135, 34], [130, 31]
            ],
            // イギリス
            [
                [-5, 50], [0, 52], [1, 58], [-4, 58], [-5, 50]
            ],
            // マダガスカル
            [
                [44, -12], [50, -16], [47, -25], [43, -25], [44, -12]
            ],
            // グリーンランド
            [
                [-50, 60], [-20, 70], [-25, 82], [-60, 82], [-50, 60]
            ]
        ];

        let scene, camera, renderer, controls, cylinderMesh;
        let textureCanvas, textureCtx, canvasTexture;
        let selectedCity1 = CITIES.find(c => c.id === 'tokyo');
        let selectedCity2 = CITIES.find(c => c.id === 'london');
        let markerMeshGroup;

        // Canvasに世界地図と指定された仕様通りの経線を描画して3Dテクスチャを生成
        function generateMapTexture() {
            textureCanvas = document.getElementById('texture-canvas');
            textureCtx = textureCanvas.getContext('2d');
            const width = textureCanvas.width;
            const height = textureCanvas.height;

            // 背景（海：明るい水色）
            textureCtx.fillStyle = '#bae6fd'; // sky-200 (明るい水色)
            textureCtx.fillRect(0, 0, width, height);

            // 緯度経度からCanvas座標への変換関数
            const lngToX = (lng) => ((lng + 180) / 360) * width;
            const latToY = (lat) => ((90 - lat) / 180) * height;

            // 陸地の描画（緑色）
            textureCtx.fillStyle = '#86efac'; // green-300 / emerald系 (明るい緑色)
            textureCtx.strokeStyle = '#4ade80'; // green-400 (やや濃い緑で縁取り)
            textureCtx.lineWidth = 2;

            CONTINENTS.forEach(polygon => {
                textureCtx.beginPath();
                polygon.forEach(([lng, lat], idx) => {
                    const x = lngToX(lng);
                    const y = latToY(lat);
                    if (idx === 0) textureCtx.moveTo(x, y);
                    else textureCtx.lineTo(x, y);
                });
                textureCtx.closePath();
                textureCtx.fill();
                textureCtx.stroke();
            });

            // 緯度線（赤道および主要な補助線）
            textureCtx.strokeStyle = '#94a3b8';
            textureCtx.lineWidth = 1;
            textureCtx.setLineDash([4, 4]);
            [-60, -30, 0, 30, 60].forEach(lat => {
                const y = latToY(lat);
                textureCtx.beginPath();
                textureCtx.moveTo(0, y);
                textureCtx.lineTo(width, y);
                textureCtx.stroke();
            });
            textureCtx.setLineDash([]); // リセット

            // 赤線 (赤道)
            const equatorY = latToY(0);
            textureCtx.strokeStyle = '#64748b';
            textureCtx.lineWidth = 1.5;
            textureCtx.beginPath();
            textureCtx.moveTo(0, equatorY);
            textureCtx.lineTo(width, equatorY);
            textureCtx.stroke();

            // 経線の描画（要件定義に基づく精密描画）
            // 全線：黒色ベース（日付変更線のみ赤色）
            // - 5度刻み: 細線/薄い点線
            // - 15度刻み: 薄い線
            // - 0, 45, 90, 135, 180度: 中線

            for (let lng = -180; lng <= 180; lng += 5) {
                const x = lngToX(lng);
                const absLng = Math.abs(lng);

                // 日付変更線 (180度 / -180度) の処理 -> 赤色
                if (absLng === 180) {
                    textureCtx.strokeStyle = '#dc2626'; // 明るい赤
                    textureCtx.lineWidth = 4;
                    textureCtx.setLineDash([]);
                }
                // 中線: 0, 45, 90, 135度
                else if (absLng % 45 === 0) {
                    textureCtx.strokeStyle = '#000000'; // 黒色
                    textureCtx.lineWidth = 2.5;
                    textureCtx.setLineDash([]);
                }
                // 薄い線: 15度刻み (45の倍数以外)
                else if (absLng % 15 === 0) {
                    textureCtx.strokeStyle = 'rgba(0, 0, 0, 0.65)'; // 薄い黒
                    textureCtx.lineWidth = 1.2;
                    textureCtx.setLineDash([]);
                }
                // Thin dashed line: 5度刻み (15の倍数以外)
                else {
                    textureCtx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; // 薄い点線
                    textureCtx.lineWidth = 1;
                    textureCtx.setLineDash([6, 6]);
                }

                textureCtx.beginPath();
                textureCtx.moveTo(x, 0);
                textureCtx.lineTo(x, height);
                textureCtx.stroke();
                textureCtx.setLineDash([]); // reset
            }

            return new THREE.CanvasTexture(textureCanvas);
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1f5f9); // slate-100 (明るい背景)

            // Camera
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 5, 28);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.3; // アングル制限
            controls.minPolarAngle = Math.PI / 2 - 0.3;
            controls.minDistance = 12;
            controls.maxDistance = 45;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            // 円筒（Cylinder）の生成
            const radius = 6.5;
            const cylinderHeight = 8.5;
            const geometry = new THREE.CylinderGeometry(radius, radius, cylinderHeight, 128, 1, true);

            // テクスチャ生成＆適用 (正像化処理)
            canvasTexture = generateMapTexture();
            canvasTexture.wrapS = THREE.RepeatWrapping;
            canvasTexture.repeat.x = 1;
            canvasTexture.offset.x = 0.5; // 本初子午線(0度)を正面に配置

            const material = new THREE.MeshStandardMaterial({
                map: canvasTexture,
                side: THREE.DoubleSide,
                roughness: 0.5,
                metalness: 0.05
            });

            cylinderMesh = new THREE.Mesh(geometry, material);
            cylinderMesh.rotation.y = 0;
            scene.add(cylinderMesh);

            // マーカーグループ
            markerMeshGroup = new THREE.Group();
            scene.add(markerMeshGroup);

            // リサイズ対応
            window.addEventListener('resize', onWindowResize);

            // 初期位置のマーカー描画
            updateMarkers();

            // アニメーションループ開始
            animate();
        }

        // 緯度経度から円筒表面上の3D座標を計算（東経が右、西経が左の正像座標系）
        function latLngToCylinderPosition(lat, lng, radius = 6.5, height = 8.5) {
            const rad = (lng * Math.PI) / 180;
            const x = radius * Math.sin(rad);
            const z = radius * Math.cos(rad);
            const y = (lat / 90) * (height / 2);

            return new THREE.Vector3(x, y, z);
        }

        // 都市マーカーの更新（赤色目立つピン）
        function updateMarkers() {
            // 既存マーカークリア
            while (markerMeshGroup.children.length > 0) {
                const obj = markerMeshGroup.children[0];
                markerMeshGroup.remove(obj);
            }

            const citiesToDraw = [
                { city: selectedCity1, color: 0xef4444, label: '都市 A: ' + (selectedCity1 ? selectedCity1.name : '') },
                { city: selectedCity2, color: 0xf59e0b, label: '都市 B: ' + (selectedCity2 ? selectedCity2.name : '') }
            ];

            citiesToDraw.forEach(({ city, color, label }) => {
                if (!city) return;

                const pos = latLngToCylinderPosition(city.lat, city.lng);

                // 1. 光る地点球体マーカー
                const sphereGeo = new THREE.SphereGeometry(0.25, 16, 16);
                const sphereMat = new THREE.MeshBasicMaterial({ color: color });
                const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
                sphereMesh.position.copy(pos);

                // 少し表面から持ち上げる
                const normal = new THREE.Vector3(pos.x, 0, pos.z).normalize();
                sphereMesh.position.add(normal.clone().multiplyScalar(0.15));

                markerMeshGroup.add(sphereMesh);

                // 2. 垂直ピンポール
                const lineGeo = new THREE.BufferGeometry().setFromPoints([
                    pos,
                    pos.clone().add(normal.clone().multiplyScalar(1.2))
                ]);
                const lineMat = new THREE.LineBasicMaterial({ color: color, linewidth: 3 });
                const line = new THREE.Line(lineGeo, lineMat);
                markerMeshGroup.add(line);

                // 3. テキストラベルスプライト
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 64;

                ctx.fillStyle = color === 0xef4444 ? 'rgba(239, 68, 68, 0.9)' : 'rgba(245, 158, 11, 0.9)';
                ctx.beginPath();
                ctx.roundRect(4, 4, 248, 56, 12);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(city.name, 128, 32);

                const spriteTexture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: spriteTexture, depthTest: false });
                const sprite = new THREE.Sprite(spriteMat);
                
                sprite.position.copy(pos.clone().add(normal.clone().multiplyScalar(1.6)));
                sprite.scale.set(2.2, 0.55, 1);
                markerMeshGroup.add(sprite);
            });

            // UI上の経緯度テキスト更新
            if (selectedCity1) {
                document.getElementById('city1-coords').textContent = formatCoords(selectedCity1.lat, selectedCity1.lng);
            }
            if (selectedCity2) {
                document.getElementById('city2-coords').textContent = formatCoords(selectedCity2.lat, selectedCity2.lng);
            }
        }

        // 座標表記フォーマット（東経/西経、北緯/南緯）
        function formatCoords(lat, lng) {
            const latStr = lat >= 0 ? `北緯${lat.toFixed(1)}°` : `南緯${Math.abs(lat).toFixed(1)}°`;
            const lngStr = lng >= 0 ? `東経${lng.toFixed(1)}°` : `西経${Math.abs(lng).toFixed(1)}°`;
            return `${lngStr}, ${latStr}`;
        }

        function setupUI() {
            const radioSorts = document.getElementsByName('sort-order');
            const select1 = document.getElementById('select-city1');
            const select2 = document.getElementById('select-city2');
            const btnResetCam = document.getElementById('btn-reset-cam');

            // 都市リストの並び替え＆ドロップダウン生成
            function populateCitySelects() {
                const sortType = Array.from(radioSorts).find(r => r.checked).value;

                const sorted = [...CITIES].sort((a, b) => {
                    if (sortType === 'kana') {
                        return a.kana.localeCompare(b.kana, 'ja');
                    } else {
                        return a.en.localeCompare(b.en);
                    }
                });

                const currentVal1 = select1.value || 'tokyo';
                const currentVal2 = select2.value || 'london';

                select1.innerHTML = '';
                select2.innerHTML = '';

                sorted.forEach(c => {
                    const nameDisplay = sortType === 'kana' ? `${c.name} (${c.kana})` : `${c.name} (${c.en})`;
                    
                    const opt1 = new Option(nameDisplay, c.id);
                    const opt2 = new Option(nameDisplay, c.id);

                    select1.add(opt1);
                    select2.add(opt2);
                });

                select1.value = currentVal1;
                select2.value = currentVal2;
            }

            // ラジオボタンイベント
            radioSorts.forEach(radio => {
                radio.addEventListener('change', populateCitySelects);
            });

            // セレクト変更イベント
            select1.addEventListener('change', (e) => {
                selectedCity1 = CITIES.find(c => c.id === e.target.value);
                updateMarkers();
            });

            select2.addEventListener('change', (e) => {
                selectedCity2 = CITIES.find(c => c.id === e.target.value);
                updateMarkers();
            });

            // カメラリセットボタン
            btnResetCam.addEventListener('click', () => {
                camera.position.set(0, 5, 28);
                controls.target.set(0, 0, 0);
                controls.update();
            });

            populateCitySelects();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            // マーカーを回転（球体に固定されているため自然に回転）
            controls.update();

            renderer.render(scene, camera);
        }

        // ページロード時スタート
        window.onload = function () {
            init3D();
            setupUI();
        };
    </script>
